services:
  # 1. Backend Web Service
  - type: web
    name: genuai-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && node src/database/migrate.js && node src/database/migrate_v2.js && node src/database/migrate_v3.js && node src/database/migrate_v4.js && node src/database/migrate_v5.js && node src/database/migrate_v6.js && node src/database/seed_dev.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # 2. Frontend Web Service
  - type: web
    name: genuai-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production
